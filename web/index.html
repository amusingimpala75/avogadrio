<html>
    <head>
        <title>avogadr.io - Molecular Wallpaper Generator</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <!-- Favicon -->
        <link rel="apple-touch-icon" href="/apple-icon.png">
        <link rel="icon" type="image/png" sizes="192x192" href="/android-icon.png">
        <link rel="icon" type="image/png" sizes="96x96" href="/favicon.png">
        <link rel="manifest" href="/manifest.json">
        <meta name="theme-color" content="#ffffff">
        <!-- Other -->
        <link rel="stylesheet" type="text/css" href="/css/bootstrap.min.css">
        <link rel="stylesheet" type="text/css" href="/css/flat-ui.css">
        <link rel="stylesheet" type="text/css" href="/css/font-awesome.min.css">
        <link rel="stylesheet" type="text/css" href="/css/animate.min.css">
        <link rel="stylesheet" type="text/css" href="/css/coloris.min.css">
        <link rel="stylesheet" type="text/css" href="/css/sidebar.css">
        <link rel="stylesheet" type="text/css" href="/css/main.css">
        <script type="text/javascript" src="/js/bootstrap.min.js"></script>
        <script type="text/javascript" src="/js/coloris.min.js"></script>
        <script type="text/javascript" src="/js/smiles-drawer.min.js"></script>
        <script type="text/javascript" src="/js-lib/pureknob.js"></script>
        <script type="text/javascript" src="/js/params.js"></script>
        <script type="text/javascript" src="/js/hamburger.js"></script>
        <script type="text/javascript" src="/js/main.js"></script>
    </head>
    <body>
        <svg id="smiles-svg"></svg>
        <div id="wrapper">
            <div class="overlay"></div>
            <nav class="navbar navbar-dark fixed-top" id="sidebar-wrapper" role="navigation">
                <div class="logo-wrapper">
                    <img src="images/logo.svg" class="logo">
                </div>
                <div class="tool-section">
                    <div class="row">
                        <div class="col-12">
                            <div class="section-lbl">Compound Name</div>
                            <hr>
                        </div>
                    </div>
                    <div class="row mtop-10">
                        <div class="col-12">
                            <input type="text" class="comp-name dark-tbox" value="" placeholder="e.g. caffeine">
                        </div>
                    </div>
                    <div class="row row-error row-error-compound mtop-10" style="display:none;">
                        <div class="col-12">
                            Invalid compound name!
                        </div>
                    </div>
                    <div class="row mtop-10">
                        <div class="col-12 text-right">
                            <button class="update-btn">Update</button>
                        </div>
                    </div>
                </div>
                <div class="tool-section mtop-10">
                    <div class="row">
                        <div class="col-12">
                            <div class="section-lbl">SMILES Structure</div>
                            <hr>
                        </div>
                    </div>
                    <div class="row mtop-10">
                        <div class="col-12">
                            <input type="text" class="comp-smiles dark-tbox" value="CCN(CC)C1=CC2=C(C=C1)N=C3C4=CC=CC=C4C(=O)C=C3O2">
                        </div>
                    </div>
                    <div class="row row-error row-error-smiles mtop-10" style="display:none;">
                        <div class="col-12">
                            Invalid SMILES structure!
                        </div>
                    </div>
                    <div class="row mtop-10">
                        <div class="col-12 text-right">
                            <button class="update-smiles-btn">Update</button>
                        </div>
                    </div>
                </div>
                <div class="tool-section mtop-10">
                    <div class="row">
                        <div class="col-12">
                            <div class="section-lbl">Custom Label</div>
                            <hr>
                        </div>
                    </div>
                    <div class="row mtop-10">
                        <div class="col-12">
                            <input type="text" class="cust-lbl-tbox dark-tbox">
                        </div>
                    </div>
                    <div class="row mtop-10">
                        <div class="col-12 text-right">
                            <button class="update-lbl-btn">Update</button>
                        </div>
                    </div>
                </div>
                <div class="tool-section mtop-10">
                    <div class="row">
                        <div class="col-12">
                            <div class="section-lbl">Colors and Rotation</div>
                            <hr>
                        </div>
                    </div>
                    <div class="row mtop-10">
                        <div class="col-7">
                            <div class="row">
                                <div class="col-6">
                                    <div class="picker-lbl">Molecule:</div>
                                </div>
                                <div class="col-6 full">
                                    <input type="text" id="picker-fg" data-coloris>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-6">
                                    <div class="picker-lbl">Background:</div>
                                </div>
                                <div class="col-6 full">
                                    <input type="text" id="picker-bg" data-coloris>
                                </div>
                            </div>
                        </div>
                        <div class="col-5">
                            <div id="rotation_knob"></div>
                        </div>
                    </div>
                </div>
                <div class="tool-section mtop-10">
                    <div class="row mtop-10">
                        <div class="col-6">
                            <div id="rotation_knob"></div>
                        </div>
                    </div>
                </div>
                <div class="tool-section mtop-10">
                    <div class="row">
                        <div class="col-12">
                            <div class="section-lbl">Download</div>
                            <hr>
                        </div>
                    </div>
                    <div class="row mtop-10">
                        <div class="col-12">
                            <a class="download-btn" download>Download!</a>
                        </div>
                    </div>
                </div>
            </nav>
            <div id="page-content-wrapper">
                <button type="button" class="hamburger is-closed animated fadeInLeft" data-toggle="offcanvas">
                    <span class="hamb-top"></span>
                    <span class="hamb-middle"></span>
                    <span class="hamb-bottom"></span>
                </button>
            </div>
            <div class="misc-text">
                MIT Licensed | Inspired by <a target="_blank" href="https://www.youtube.com/user/TheRedNile">Nile Red's awesome chemistry videos</a>.
            </div>
        </div>
    </body>
</html>
