name: Build and Publish

'on':
  push:
    branches:
    - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - uses: cachix/install-nix-action@v31

    - id: build
      run: nix build

    - id: upload
      uses: actions/upload-pages-artifact@v3
      with:
        path: result/

  publish:
    environment:
      name: github-pages
      url: ${{ steps.upload.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write

    steps:
    - uses: actions/deploy-pages@v4
